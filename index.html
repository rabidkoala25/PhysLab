<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A unified, high-performance web platform for interactive physics simulations." />
  <title>PhysLab — Physics Simulation Platform</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============================================================= -->
  <!-- APP SHELL                                                     -->
  <!-- ============================================================= -->
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo" aria-hidden="true">◎</span>
      <div>
        <h1 class="app-header__title">PhysLab</h1>
        <p class="app-header__subtitle">Interactive physics, in one place.</p>
      </div>
    </div>

    <div class="app-header__tools">
      <label class="search">
        <span class="search__icon" aria-hidden="true">⌕</span>
        <input
          id="library-search"
          class="search__input"
          type="search"
          placeholder="Search simulations…"
          autocomplete="off"
          aria-label="Search simulations"
        />
      </label>
    </div>
  </header>

  <!-- ============================================================= -->
  <!-- LIBRARY DASHBOARD                                             -->
  <!-- ============================================================= -->
  <main class="dashboard" aria-labelledby="library-heading">
    <div class="dashboard__intro">
      <h2 id="library-heading" class="dashboard__heading">Simulation Library</h2>
      <p class="dashboard__lede">
        Select a module to launch it in its own dedicated, full-screen window.
      </p>
    </div>

    <!-- The applet loader populates this grid from the registry. -->
    <section
      id="applet-grid"
      class="library-grid"
      role="list"
      aria-label="Available simulations"
    >
      <!-- Cards injected by js/app.js -->
      <p class="library-grid__loading" id="grid-loading">Loading library…</p>
    </section>

    <!-- Surfaced if the browser blocks the simulation pop-up window. -->
    <p id="popup-warning" class="dashboard__notice" hidden>
      ⚠ Your browser blocked the simulation window. Please allow pop-ups for
      this site, then click the simulation again.
    </p>
  </main>

  <!-- app.js launches each applet in its own isolated browser window. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
