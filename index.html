<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A unified, high-performance web platform for interactive physics simulations." />
  <title>PhysLab — Physics Simulation Platform</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============================================================= -->
  <!-- APP SHELL                                                     -->
  <!-- ============================================================= -->
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo" aria-hidden="true">◎</span>
      <div>
        <h1 class="app-header__title">PhysLab</h1>
        <p class="app-header__subtitle">Interactive physics, in one place.</p>
      </div>
    </div>

    <div class="app-header__tools">
      <label class="search">
        <span class="search__icon" aria-hidden="true">⌕</span>
        <input
          id="library-search"
          class="search__input"
          type="search"
          placeholder="Search simulations…"
          autocomplete="off"
          aria-label="Search simulations"
        />
      </label>
    </div>
  </header>

  <!-- ============================================================= -->
  <!-- LIBRARY DASHBOARD                                             -->
  <!-- ============================================================= -->
  <main class="dashboard" aria-labelledby="library-heading">
    <div class="dashboard__intro">
      <h2 id="library-heading" class="dashboard__heading">Simulation Library</h2>
      <p class="dashboard__lede">
        Select a module to launch it in an immersive, focused workspace.
      </p>
    </div>

    <!-- The applet loader populates this grid from the registry. -->
    <section
      id="applet-grid"
      class="library-grid"
      role="list"
      aria-label="Available simulations"
    >
      <!-- Cards injected by js/app.js -->
      <p class="library-grid__loading" id="grid-loading">Loading library…</p>
    </section>
  </main>

  <!-- ============================================================= -->
  <!-- APPLET MODAL / POP-UP EXECUTION SURFACE                       -->
  <!--                                                               -->
  <!-- A single reusable, isolated overlay. The active applet is     -->
  <!-- mounted into `.modal__stage`. The stage is intentionally      -->
  <!-- layered so future features have obvious mount points:         -->
  <!--   • render-layer   → GPU/WebGL/WebGPU canvas (60 FPS loop)    -->
  <!--   • overlay-layer  → vector overlays (velocity / accel)       -->
  <!--   • telemetry      → charts, graphs, digital meters           -->
  <!--   • controls       → parameter panels + validation            -->
  <!-- ============================================================= -->
  <div
    id="applet-modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    hidden
  >
    <div class="modal__backdrop" data-modal-dismiss></div>

    <div class="modal__window" role="document">
      <header class="modal__bar">
        <div class="modal__meta">
          <h2 id="modal-title" class="modal__title">Simulation</h2>
          <p id="modal-desc" class="modal__desc"></p>
        </div>
        <div class="modal__actions">
          <!-- HOOK: import/export simulation state lives here later. -->
          <button
            type="button"
            class="btn btn--ghost"
            id="modal-export"
            title="Export state (coming soon)"
            disabled
          >Export</button>
          <button
            type="button"
            class="btn btn--ghost"
            id="modal-import"
            title="Import state (coming soon)"
            disabled
          >Import</button>
          <button
            type="button"
            class="btn btn--icon"
            id="modal-close"
            aria-label="Close simulation"
            data-modal-dismiss
          >✕</button>
        </div>
      </header>

      <!-- The applet's mount target. Cleared between launches. -->
      <div id="applet-stage" class="modal__stage" aria-live="polite"></div>
    </div>
  </div>

  <!-- app.js is an ES module; it resolves the registry and loads applets. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
